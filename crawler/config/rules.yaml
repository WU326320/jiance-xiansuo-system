# 采集模块配置（R1）
# 口径字段沿用 /workspace/requirements/rules.example.yaml；采集节流/重试在这里配置。
# 相对路径按运行目录解析；可用 CRAWLER_OUTPUT_DIR / CRAWLER_LOG_DIR / CRAWLER_STATE_DIR /
# CRAWLER_PROFILES_DIR 覆盖。
config_version: "2026-11-06.2"
caliber_version: "v1.0"

platforms:                       # 本轮只启用三平台；拼多多不开
  taobao: {enabled: true}        # 含天猫
  jd:     {enabled: true}
  "1688": {enabled: true}
  pdd:    {enabled: false}

# ---------- 浏览器启动方式 ----------
# mode: playwright = Scrapling/Playwright 自带浏览器 + 持久化 profile（原行为）
#       cdp        = 连接系统真实 Chrome（connect_over_cdp），共享人工登录后的 profile
# 京东默认 cdp；显式写 platform_modes.jd: playwright 可退回原模式。
# cdp 端口 = browser.port + 平台序号（taobao=9222, jd=9223, 1688=9224）。
# 启动参数严格只有 --user-data-dir=profiles/<platform>-chrome 和
# --remote-debugging-port=<port>，不加任何自动化开关。
browser:
  mode: playwright
  platform_modes:
    jd: cdp
  port: 9222
  # ports: {jd: 9333}             # 需要固定单平台端口时再打开
  display: ":6"
  chrome_executable: null        # null = which google-chrome/google-chrome-stable/chromium
  startup_timeout_seconds: 20
  poll_interval_seconds: 0.2

# ---------- 委托 IP（示例占位；真实资料由 Xuan 补充） ----------
ips:
  - code: huluxiongdi
    name: 葫芦兄弟
    aliases: [葫芦娃, 葫芦七兄弟]
    variants: [葫芦宝宝]
  - code: heimaojingzhang
    name: 黑猫警长
    aliases: []
    variants: []
  - code: yeluoli
    name: 叶罗丽
    aliases: [叶罗丽精灵梦]
    variants: []
  - code: wuhuang
    name: 吾皇
    aliases: [吾皇万睡, 巴扎黑]
    variants: []

# ---------- 采集 / 登录 / 节流 ----------
crawl:
  # 数量字段仅保留旧配置兼容；逐页采到真实末页，不按页数或商品数量截断。
  max_pages: 0
  daily_max_pages: 0
  max_items_per_keyword: 0
  # ---------- 淘宝/天猫请求间隔（控制速度，不限制采集总量） ----------
  taobao:
    max_keywords_per_run: 0
    max_pages: 0
    rate_limit:
      requests_per_minute: 3           # 20 -> 3
      page_interval_seconds: [30, 50]  # [4,9] -> [30,50] 秒
      keyword_interval_seconds: [180, 300]  # [20,40] -> [180,300] 秒
      detail_interval_seconds: [45, 90]     # [6,12] -> [45,90] 秒
    detail:
      enabled: true
      detail_min_text_score: 60        # 35 -> 60（低于阈值不打开详情）
      max_per_run: 0                   # 全部候选逐条补采
      filter_by_score: true            # 有列表 JSONL 时按分数过滤
      allow_unscored: false            # 有列表但 ID 无分数时跳过；仅当天无列表数据的人工 ID 保留
    batch:
      size: 4                          # 每批 4 个关键词
      rest_seconds: 1800               # 批间休息 30 分钟
      segments_per_day: 0
      max_pages_per_segment: 0
      max_items_per_segment: 0
    risk:
      empty_result_streak: 2           # 新增：连续 2 次空结果立即停，不重试
  # 1688：只对“命中关键词且店名为空”的候选补抓店名；详情页优先、失败再店铺页。
  # 复用 rate_limit.detail_interval_seconds，全部缺店名候选逐条补采。
  ali1688:
    scroll_steps: 3
    scroll_wait_ms: 600
    shop_name_backfill:
      enabled: true
      max_per_run: 0                   # 全部缺店名候选
      source: auto                     # auto/detail/shop
  rate_limit:
    requests_per_minute: 20
    page_interval_seconds: [4, 9]
    keyword_interval_seconds: [20, 40]
    detail_interval_seconds: [6, 12]
  retry:
    attempts: 3
    backoff_seconds: [5, 15, 45]
    jitter_seconds: 0
  # 详情补抓开关：1688 本轮默认停用（列表照采，详情不进入）。
  detail:
    enabled: true
    platforms:
      taobao: true
      jd: true
      "1688": false
    debug_capture_limit: 2
    debug_capture_platforms: [taobao]
    detail_wait_ms_range: [2500, 4500]
  timeout_ms: 30000
  page_wait_ms: 1500
  page_wait_ms_range: [1500, 4000]
  parallel_platforms: false
  timezone: Asia/Shanghai
  headless: true
  keyword_hit_warn_ratio: 0.2
  jd_scroll_steps: 6
  jd_scroll_wait_ms: 800
  jd_price_wait_ms: 6000
  image:
    enabled: true
    max_bytes: 15728640
    timeout_seconds: 20
  # 显式关键词优先；为空时用上面 ips 的名称/别名/变体自动生成矩阵。
  keywords: []
  output_dir: ./out
  log_dir: ./logs
  state_dir: ./state

# 安全边界（不提供开关去打开这些行为）：只复用用户本人已登录的正常浏览器。
policy:
  use_user_logged_in_browser: true
  fingerprint_spoofing: false
  mouse_trajectory_simulation: false
  proxy_or_ip_rotation: false
  multi_account_rotation: false

security:
  profile_dir: ./profiles/{platform}
  profile_key_env: CLUE_PROFILE_KEY

# ---------- 以下字段供判定模块使用；采集层只透传/不归一 shop_type ----------
exclude:
  genuine_keywords: [官方旗舰店, 正版授权, 品牌授权, 官方正品, 防伪]
  genuine_shop_labels: [京东自营]
  categories: []
whitelist_file: whitelist.csv
dedup:
  suppress_statuses: [已确认, 已录入SaaS, 驳回]
  suppress_days: 90
  suppress_days_rejected: 30
legal_hints:
  - {keywords: [书评, 教程, 解析], hint: "可能涉及合理使用，请人工判断"}

text_score:
  weights:
    ip_hit: 45
    variant_hit: 12
    carrier_hit: 16
    category_hit: 10
    white_label_shop: 6
    brand_official: -25
    genuine_signal: -55
    other_ip_only: -30
    other_ip_also: -18
    no_ip: -8
    short_title: -20
  short_title_len: 8
  level: {high: 60, medium: 35}
  vision_rescue_min: 12
  words:
    carrier: [印花, 图案, 公仔, 挂件, 手机壳, 贴纸, 徽章, 抱枕, 玩偶]
    category: [童装, 卫衣, 睡衣, 文具, 箱包, 水杯, 床品]
    white_label: [制衣, 服饰厂, 供应链, 工厂店, 批发, 商行]
    brand_official: [正版, 官方]
    other_ips: [示例其他IP]

visual:
  confirm: 70
  reject: 25
  reuse_by_phash: true

combined:
  w_text: 0.45
  w_visual: 0.55
  floor_on_confirm: 75
  cap_on_reject: 35
  min_final_score: 35

amount:
  comment_multiplier: 10
  fuzzy_use_lower_bound: true
  on_sales_missing: comments_x_multiplier
  on_comments_missing: use_sales
  decimals: 2

aggregate:
  key: [platform, shop_id]
  shop_threshold: 500000
  same_day_only: true
  count_delisted: false

fetch:
  taobao:
    detail_min_text_score: 60
  jd:
    near_band_low: 0.6
    near_band_high: 1.0

shop_type_mapping:
  天猫: 企业
  旗舰店: 企业
  专卖店: 企业
  京东POP: 未知
  1688实力商家: 企业
  个体工商户: 个体户
  个人店: 个人
shop_type_priority: [企业, 个体户, 未知, 个人]

payment_ability:
  signals:
    listed_or_soe: true
    investor_shareholder: true
    registered_capital_min: 10000000
    has_patent_or_app: true
    tmall_or_crown_shop: true
    enterprise_shop: true

confidence:
  base: weighted_final_by_amount
  adjust:
    has_missing_field: -10
    all_visual_confirmed: 10

alert:
  min_items_per_platform: 50
  email_to: ["wuhengxuan@ip-sky.cn"]
  smtp:
    host: "smtp.qiye.aliyun.com"
    port: 465
    ssl: true
    sender: "wuhengxuan@ip-sky.cn"
    auth_code_encrypted: "待 Xuan 在与后端的 1:1 中提供"
